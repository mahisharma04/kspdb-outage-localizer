# Render blueprint. Push this repo to GitHub, then in Render:
#   New + -> Blueprint -> pick this repo. It builds the Dockerfile and deploys.
#
# The free plan has an ephemeral filesystem, so we default to SQLite (which
# reseeds on cold start — fine for a demo). To make data durable, uncomment the
# database block and the DATABASE_URL fromDatabase reference below.
services:
  - type: web
    name: kspdb-outage-localizer
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: kspdb-db
      #     property: connectionString
      # - key: OPENAI_API_KEY      # optional: enables the LLM briefing
      #   sync: false

